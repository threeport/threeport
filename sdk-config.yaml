ApiDocs:
  Title: "Threeport RESTful API"
  Description: "Core API server for the Threeport application orchestration control plane."
  ContactUrl: "https://threeport.io"
ApiObjectGroups:
- Name: secret
  Objects:
    - Name: SecretDefinition
      Versions:
        - v0
      Reconcilable: true
      Tptctl:
        Enabled: true
        ConfigPath: true
      AllowCustomMiddleware: true
      DisableNotificationPersistence: true
    - Name: SecretInstance
      Versions:
        - v0
      Reconcilable: true
      Tptctl:
        Enabled: true
        ConfigPath: true
- Name: actuator
