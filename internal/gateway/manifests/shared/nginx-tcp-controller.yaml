apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-tcp
  namespace: nukleros-ingress-system
  labels:
    app: nginx-tcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-tcp
  template:
    metadata:
      labels:
        app: nginx-tcp
    spec:
      serviceAccountName: nginx-ingress
      containers:
        - name: nginx-ingress
          image: nginx/nginx-ingress:5.5.4
          args:
            - -nginx-configmaps=$(POD_NAMESPACE)/nginx-config
            - -enable-custom-resources
            - -global-configuration=$(POD_NAMESPACE)/nginx-ingress
            - -ingress-class=nginx-tcp
            - -leader-election-lock-name=nginx-tcp-leader-election
            - -enable-prometheus-metrics
          ports: []
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - mountPath: /etc/nginx/secrets
              name: nginx-secrets
      volumes:
        - name: nginx-secrets
          secret:
            secretName: default-server-secret
