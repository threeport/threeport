apiVersion: platform.addons.nukleros.io/v1alpha1
kind: IngressComponent
metadata:
  name: ingress
spec:
  # collection.name joins this component to the SupportServices object of that name.
  # The SupportServices "cloud" parameter must be "local", or the operator does not create the nginx-ingress-nodeport service.
  collection:
    name: threeport-support-services
  domainName: threeport.local
  namespace: nukleros-ingress-system
  nginx:
    include: true
    version: "5.7.0"
  kong:
    include: false
    proxyServiceName: kong-proxy
  # The IngressComponent type marks "iamRoleArn" omitempty, so an empty string is left out of the object.
  # The custom resource requires "iamRoleArn", and the apiserver rejects an update that omits it.
  # The value "local" keeps the field present when external-dns has no AWS role.
  externalDNS:
    provider: none
    iamRoleArn: local
