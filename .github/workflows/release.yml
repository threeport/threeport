# Publishes a release of threeport when a version tag is pushed.
# The tag's prerelease segment selects the channel: v0.7.0-dev.N is a dev
# build, v0.7.0-rc.N a release candidate, v0.7.0 a GA release; goreleaser
# marks prerelease tags as GitHub pre-releases. Cut a release with a mage
# target (mage release:dev, release:rc, or release:ga); the base comes from
# version.txt with no argument. It tags dev and pushes. Component images are
# built separately by the images workflow on the same v* tag.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # goreleaser needs full history to generate the changelog
        fetch-depth: 0

    - name: Go setup
      uses: ./.github/actions/go-setup

    # emit go-parallelism env so the goreleaser step resolves
    # GORELEASER_PARALLELISM and GOFLAGS
    - run: mage ci:env >> "$GITHUB_ENV"

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
      with:
        # the goreleaser binary version to install, not the Go version
        version: v1.26.2
        install-only: true

    # shell-expand GORELEASER_PARALLELISM from GITHUB_ENV. ${{ env.X }} in
    # `with.args` is evaluated when the job starts, before ci:env runs, so an
    # empty expansion made --parallelism consume -f and fail parse
    - name: Run GoReleaser
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: goreleaser release --clean --parallelism "${GORELEASER_PARALLELISM:-1}" -f ./.goreleaser.yml
