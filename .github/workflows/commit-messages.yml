name: Check Commit Messages

on:
  push:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  check-latest-commit:
    name: Check Latest Commit Message
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27'

    - name: Install mage
      run: go install github.com/magefile/mage@latest

    - name: Check Latest Commit Message
      run: mage test:commits

  check-commits:
    name: Check Commit Messages
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Get PR Commits
      id: get-pr-commits
      uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d # master
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check Commit Messages
      uses: tim-actions/commit-message-checker-with-regex@094fc16ff83d04e2ec73edb5eaf6aa267db33791 # v0.3.2
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}
        pattern: "^((build|chore|ci|dev|docs|feat|fix|perf|refactor|release|revert|style|test)(\\([^)\\r\\n]+\\))?(!)?: [^\\r\\n]+(\\n\\n[\\s\\S]+)?)|(Merge [^\\r\\n]+)|(Initial commit$)$"
        error: |
            commit message check failed:
            message is not conventional commits format
            please see https://www.conventionalcommits.org/en/v1.0.0/#specification

  check-pull-request-title:
    name: Check Pull Request Title
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check Pull Request Title
      uses: deepakputhraya/action-pr-title@077bddd7bdabd0d2b1b25ed0754c7e62e184d7ee # master
      with:
        regex: "^((build|chore|ci|dev|docs|feat|fix|perf|refactor|release|revert|style|test)(\\([^)\\r\\n]+\\))?(!)?: .+)|(Merge .+)|(Initial commit$)$"

