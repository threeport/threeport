name: Docs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    tags:
      - 'docs*'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  check:
    name: Check Docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
    - uses: actions/setup-python@bd6b4b6205c4dbad673328db7b31b7fab9e241c0 # v4.6.1
      with:
        python-version: 3.x
    - run: pip install -r docs/requirements.txt
    - uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26'
    - run: go install github.com/magefile/mage@latest
    # The command check asks tptctl for its own subcommands, so the binary has
    # to exist before the checks run.
    - run: mage build:tptctl
    - run: mage test:docs
    # The documentation map is derived from the site navigation, so a nav
    # change that was not regenerated shows up here as a diff.
    - run: mage dev:generateAgentsIndex
    - run: git diff --exit-code

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6.0.3
    - uses: actions/setup-python@v4.6.1
      with:
        python-version: 3.x
    - run: pip install mkdocs-material mkdocs-material-extensions mike
    - run: cd docs && mkdocs gh-deploy --force

