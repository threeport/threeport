# Reusable: runs `goreleaser release --clean` against the upstream
# .goreleaser.yml. Callers either rely on the natural tag context
# (release.yml on tag push) or pass a synthesized tag via `ref`.

name: GoReleaser

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (tag, branch, or sha). Empty defaults to the caller's event ref.
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  goreleaser:
    timeout-minutes: 30
    runs-on: ubuntu-latest-m
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # goreleaser needs full history to generate the changelog
        fetch-depth: 0
        ref: ${{ inputs.ref }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    # Previous runs appeared to hang for ~9-10 minutes at "building binaries"
    # before the runner was killed. Process-tree diagnostics showed it's not
    # actually stuck: goreleaser builds tptctl for 8 GOOS/GOARCH combos with
    # 4 running in parallel by default, and every parallel `go build`
    # independently re-verifies/re-parses this repo's large dependency graph
    # (AWS/GCP/Oracle SDKs, k8s client-go, gorm, pgx, etc.) before compiling
    # anything - on a 4 vCPU runner that's real CPU contention, not a
    # deadlock. --parallelism limits how many builds run at once so they
    # stop fighting over the same CPUs.
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v5.0.0
      with:
        version: v1.26.2
        args: release --clean --parallelism 2 -f ./.goreleaser.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOPROXY: 'off'
        GOSUMDB: 'off'
