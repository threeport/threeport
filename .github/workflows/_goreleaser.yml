# Reusable: runs `goreleaser release --clean` against the upstream
# .goreleaser.yml. Callers either rely on the natural tag context
# (release.yml on tag push) or pass a synthesized tag via `ref`.

name: GoReleaser

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (tag, branch, or sha). Empty defaults to the caller's event ref.
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        # goreleaser needs full history to generate the changelog
        fetch-depth: 0
        ref: ${{ inputs.ref }}

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@7ec5c2b0c6cdda6e8bbb49444bc797dd33d74dd8 # v5.0.0
      with:
        version: v1.26.2
        args: release --clean -f ./.goreleaser.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
