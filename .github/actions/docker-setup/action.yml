# Single place the Docker Buildx setup-action version is pinned, so it never
# drifts across the workflows and actions that need a builder.

name: Docker setup
description: Set up Docker Buildx with optional driver options.

inputs:
  driver-opts:
    description: buildx driver-opts, e.g. network=host to reach a local registry.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      with:
        driver-opts: ${{ inputs.driver-opts }}
